<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Redirecionando — grafo curricular</title>
<script>
(function () {
  var prefixo = '/cv/';
  var caminho = location.pathname;
  if (caminho.indexOf(prefixo) === 0) {
    var resto = caminho.slice(prefixo.length);
    location.replace(prefixo + (resto ? "#" + resto : "") + location.search);
  }
})();
</script>
</head>
<body>
<p>Este endereço é a URI de um registro do currículo.
<a href="/cv/">Abrir o grafo curricular</a>.</p>
</body>
</html>
